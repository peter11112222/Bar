 solid var(--border);border-radius:16px;padding:20px}.quizitem h3{font-size:15px}.choices{display:grid;gap:8px}.choices button{border:1px solid var(--border);border-radius:9px;background:#f4f7f9;padding:10px 14px;text-align:right}.choices button.correct{border-color:#5cb989;background:#e5f9ed;color:#146a40}.choices button.wrong{border-color:#e4938b;background:#fff0ec;color:#a3423a}.explain{padding:10px 12px;border-radius:8px;background:#edf6fa;font-size:11px;color:#456b7c;margin:12px 0}.overlay{position:fixed;inset:0;background:#031826b0;z-index:200;display:flex;justify-content:flex-start}.modal{background:#fff;width:min(690px,100%);height:100%;overflow:auto;padding:34px}.close{float:left;background:#eff3f6;border:0;border-radius:9px;padding:8px 12px}.modal h2{font-size:29px;margin:14px 0 0}.modal .en{font:700 13px Manrope;color:#bd8930}.modal p{line-height:2;color:#657d8f}.steps{background:#f6f9fb;border:1px solid var(--border);padding:13px 18px;border-radius:12px;margin:18px 0}.modal h3{font-size:15px;margin:21px 0 8px}.modal .warn{background:#fff5e5;border:1px solid #f1dcaa;border-radius:12px;padding:12px 15px;color:#87601d;font-size:12px;line-height:1.9}.modal .end{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:17px 0}.modal .end a{color:#9b6e1d;text-decoration:underline;font-weight:800}.modal .done{background:#e4f6ec;color:#166b43;border:1px solid #c6e9d6;border-radius:9px;padding:9px 13px;font-weight:800}.footer{text-align:center;color:#75889a;font-size:10px;padding:19px;line-height:1.8;border-top:1px solid var(--border)}.toast{position:fixed;left:23px;bottom:23px;background:#102e47;color:white;padding:12px 20px;z-index:300;border-radius:10px;border:1px solid #dfb251}.empty{text-align:center;padding:35px;color:#80919e}.sourcemeta{margin:22px 0;padding:16px;border:1px solid #dce8ef;background:#fff;border-radius:12px;font-size:11px;color:#778b9a;line-height:1.95}

</style></head><body><div id="app"></div><script id="data" type="application/json">{"f":[{"id":"chat","title":"المحادثة الذكية","en":"Chat","group":"ابدأ هنا","level":"مبتدئ","description":"المحادثة مش مجرد سؤال وجواب. تقدر تحوّلها لمساعد يطلب البيانات الناقصة، يقارن بدائل، ويجهز مسودات قابلة للمراجعة.","when":"لما تكون المهمة محتاجة تفكير أو كتابة أو تنظيم معلومات.","steps":["حدد النتيجة المطلوبة","قدم الحقائق والقيود","اطلب أسئلة توضيحية قبل الحل","راجع الأرقام والمصادر"],"scenario":"تحويل ملاحظات تفتيش الموقع إلى سجل ملاحظات مرتب","caution":"لا تتعامل مع الرد باعتباره اعتمادًا هندسيًا.","prompt":"Act as a senior site engineer. Ask for missing project facts first. Turn my notes into an auditable issue register, separating facts, assumptions, and actions.","url":"https://claude.com/product/overview"},{"id":"files","title":"رفع وتحليل الملفات","en":"Files","group":"ابدأ هنا","level":"مبتدئ","description":"بدل نسخ محتوى الملف يدويًا، تقدر تستخدم مستندات Word وPDF وجداول Excel كمراجع للمهمة مع طلب استشهادات وأرقام صفحات.","when":"لما تحتاج استخراج اشتراطات أو تحليل جداول أو مقارنة إصدارات.","steps":["ارفع الملف المسموح بمشاركته","اطلب استخراجًا منظّمًا بالمراجع","راجع المقاطع والأرقام الأصلية","دوّن أي جزء غير مقروء"],"scenario":"تلخيص 80 صفحة من المواصفات إلى Checklist للفحص","caution":"الملفات المصورة والرسومات الدقيقة قد تتطلب تدقيقًا بصريًا إضافيًا.","prompt":"Review the attached technical specification. Build a traceable checklist with requirement, source section, responsible party, evidence, and open questions. Never invent source citations.","url":"https://claude.com/product/overview"},{"id":"projects","title":"المشروعات","en":"Projects","group":"نظّم شغلك","level":"مبتدئ","description":"مساحة بتجمع المحادثات وتعليمات المشروع والمراجع ذات الصلة؛ مناسبة لما تكون بتشتغل على مشروع فترة طويلة بدل تبدأ من الصفر كل مرة.","when":"للتقارير الدورية والمستندات المشتركة في نفس المشروع.","steps":["أنشئ مشروعًا باسم واضح","أضف تعليمات ثابتة لنوع المخرجات","ارفع المراجع المعتمدة فقط","راجع تحديثات الإصدارات بانتظام"],"scenario":"مشروع برج سكني: سياق ثابت للـRFI والتقارير","caution":"المراجع القديمة لا تتحول تلقائيًا إلى أحدث إصدار.","prompt":"Create project instructions for a construction project assistant: use metric units, track document revisions, flag missing evidence, and never certify design compliance.","url":"https://support.claude.com/en/articles/9519177-how-can-i-create-and-manage-projects"},{"id":"artifacts","title":"المخرجات والتطبيقات التفاعلية","en":"Artifacts","group":"ابنِ وابتكر","level":"متوسط","description":"Claude يقدر ينشئ ملفات وعروض وتصميمات وواجهات ولوحات متابعة وأدوات تفاعلية قابلة للمعاينة والتعديل.","when":"لما تحتاج ناتجًا عمليًا بدل إجابة نصية فقط.","steps":["اكتب هدف الأداة ومدخلاتها","اطلب نسخة قابلة للتجربة","اختبر قيمًا صحيحة وخاطئة","راجع المخرجات قبل المشاركة"],"scenario":"حاسبة خرسانة تفاعلية توضح المعادلات والوحدات","caution":"توفر قوالب معينة ومزايا التخزين والربط يعتمد على الخطة.","prompt":"Build an interactive construction quantity calculator with unit validation, transparent formulas, input errors, and downloadable summary. Label all assumptions.","url":"https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them"},{"id":"code","title":"البرمجة مع Claude Code","en":"Claude Code","group":"ابنِ وابتكر","level":"متقدم","description":"مساعد لتطوير البرامج وفهم المشاريع البرمجية وتعديل ملفاتها وتشغيل اختبارات في بيئات مصرح بها.","when":"لإنشاء أداة داخلية أو تطوير سكربت هندسي حقيقي.","steps":["اعمل نسخة احتياطية من الكود","حدد متطلبات واضحة واختبارات قبول","اسمح بتغييرات محددة","راجع التعديلات والتبعيات"],"scenario":"أداة لتدقيق بيانات BOQ في CSV","caution":"متابعة الشفرة والاختبارات مسؤولية صاحب المشروع.","prompt":"Inspect this codebase and propose a minimal tested implementation for a BOQ duplicate detector. Explain the plan before changing files.","url":"https://code.claude.com/docs"},{"id":"cowork","title":"تنفيذ المهام متعددة الخطوات","en":"Cowork & Tasks","group":"ا s, flag overdue items, cite references, and avoid changing records.","url":"https://claude.com/product/overview"},{"id":"artifact-connect","title":"ربط التطبيقات بالمخرجات","en":"Connected Artifacts","group":"ابنِ وابتكر","level":"متقدم","description":"بعض Artifacts يمكنها استخدام موصلات وتخزين بيانات وفق قيود الخطة والمشاركة.","when":"عند إنشاء أداة صغيرة تستفيد من بيانات خدمة موثوقة.","steps":["حدد البيانات والموصل","راجع صلاحيات المشاركة","اختبر الصلاحيات","افحص ثبات النتائج"],"scenario":"لوحة متابعة لمهام فريق صغير","caution":"ميزة الربط وتخزين البيانات ليست متاحة بنفس الشكل في جميع الخطط.","prompt":"Design a connected engineering issue tracker artifact with a read-only source, clear validation and per-user permission rules.","url":"https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them"},{"id":"api","title":"استخدام Claude API","en":"Claude API","group":"ابنِ وابتكر","level":"متقدم","description":"دمج إمكانيات Claude في أدوات الشركة عبر الخادم مع مفاتيح محمية وحدود استخدام.","when":"عندما تريد منتجًا يستخدم AI مباشرة بصورة آمنة.","steps":["صمم واجهة الإدخال والتحقق","احفظ المفاتيح في الخادم","ضع حدود تكاليف","اختبر أخطاء API"],"scenario":"مساعد لإنشاء RFI بعد مراجعة المستخدم","caution":"استهلاك API قد تكون له رسوم مستقلة.","prompt":"Design the backend for an engineering RFI drafting assistant. Include key isolation, rate limits, validation, audit logs and human approval.","url":"https://platform.claude.com/docs"},{"id":"art-templates","title":"قوالب Artifacts","en":"Artifact Templates","group":"ابنِ وابتكر","level":"مبتدئ","description":"قوالب جاهزة لفئات مثل Docs وSlides وDesign لتسريع البداية، وبعض القوالب المتقدمة تختلف حسب الخطة.","when":"لما تعرف نوع الناتج قبل كتابة الطلب.","steps":["اختر قالب المخرج","اكتب البيانات والهوية","اطلب تعديلات محددة","راجع المنتج النهائي"],"scenario":"تصميم لوحة عرض مؤشرات المشروع","caution":"قوالب Dashboards وMotion لها شروط إتاحة خاصة.","prompt":"Create a polished engineering project executive summary using a document template and the provided verified KPI dataset.","url":"https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them"},{"id":"mobile","title":"Claude على الموبايل","en":"Mobile","group":"ابدأ هنا","level":"مبتدئ","description":"تابع المحادثات والمهام وبعض الملفات أثناء التنقل حسب النظام والإتاحة.","when":"لتسجيل ملاحظات الموقع وإرسال مسودات للمراجعة.","steps":["استخدم التطبيق الرسمي","راجع الأذونات","أدخل ملاحظات واضحة","أكد الأرقام قبل الإرسال"],"scenario":"تحويل نقاط تفتيش سريعة إلى Checklist","caution":"الميزات التي تتطلب ملفات محلية قد تحتاج تطبيق الكمبيوتر.","prompt":"Turn these short site inspection notes into a prioritized punch list with clearly marked unknowns.","url":"https://claude.com/product/overview"},{"id":"voice","title":"التفاعل الصوتي","en":"Voice","group":"ابدأ هنا","level":"مبتدئ","description":"يمكنك استخدام الصوت لإملاء الأفكار ومناقشة تقرير أو مهمة عند دعم الميزة.","when":"عند التنقل أو لما تكون الكتابة صعبة.","steps":["افتح الصوت إن كان متاحًا","اذكر الأرقام بوضوح","اطلب تلخيص المدخلات","راجع النص النهائي"],"scenario":"إملاء ملاحظات الموقع لصياغة تقرير لاحق","caution":"انتبه لأخطاء تفريغ المصطلحات والأرقام.","prompt":"Rewrite these dictated construction notes as a daily report, highlighting uncertain terms and quantities for confirmation.","url":"https://claude.com/product/overview"},{"id":"prompting","title":"احتراف صياغة البرومبتات","en":"Prompt Engineering","group":"ابدأ هنا","level":"مبتدئ","description":"برومبت احترافي = هدف واضح + سياق + بيانات + قيود + شكل المخرج + مراجعة.","when":"لتحسين دقة أي طلب حتى لو كنت مبتدئًا.","steps":["حدد المهمة والدور","أضف معلومات المشروع","اذكر القيود الصريحة","حدد شكل الإجابة وآلية التحقق"],"scenario":"فرق بين «اكتب تقرير» وتقرير مفصل بمدخلات ومراجع","caution":"البرومبت القوي لا يضمن صحة الحقائق غير المتاحة.","prompt":"Act as a construction project controls engineer. Using only supplied data, create a weekly report with KPIs, deviations, sources, risks, and decisions needed.","url":"https://platform.claude.com/docs"},{"id":"privacy","title":"الخصوصية والأمان","en":"Privacy & Safety","group":"نظّم شغلك","level":"مبتدئ","description":"مراجعة أذونات استخدام البيانات ومشاركة الملفات وصلاحيات الموصلات قبل إدخال مستندات العمل.","when":"قبل رفع عقود أو بيانات موظفين أو ملفات مشروع سرية.","steps":["راجع سياسة العمل","احذف المعرّفات غير الضرورية","قلّل الصلاحيات","احتفظ بنسخة من الملفات الأصلية"],"scenario":"إخفاء بيانات العميل من عقد قبل مراجعة بند","caution":"لا تدخل أسرار شركتك دون إذن.","prompt":"Create a redaction checklist for sensitive construction documents before AI-assisted review.","url":"https://privacy.claude.com"},{"id":"models","title":"اختيار النموذج المناسب","en":"Models & Effort","group":"حلّل وابحث","level":"متوسط","description":"اختر بين سرعة الاستجابة وعمق المعالجة والتكلفة بحسب المهمة والنموذج المتاح.","when":"عند المقارنة بين صيغ مختلفة من المهمة.","steps":["اختر اختبارًا موحدًا","حدد معايير النجاح","قارن المخرجات","راجع التكلفة والحدود"],"scenario":"اختبار استخراج اشتراطات من 10 صفحات","caution":"لا تفترض أن أسماء النماذج وأسعارها ثابتة.","prompt":"Create a reproducible benchmark for evaluating two AI models on specification extraction, including correctness, citations, latency and review effort.","url":"https://claude.com/product/overview"},{"id":"team","title":"التعاون والإدارة","en":"Team & Enterprise","group":"نظّم شغلك","level":"متوسط","description":"خيارات إدارة الوصول والتعليمات والتعاون المشترك بحسب خطة الفريق.","when":"لأقسام المشاريع والمكتب الفني الكبيرة.","steps":["حدد الأدوار","أضف سياسات مصادر معتمدة","أنشئ سير مراجعة","راجع سجلات المشاركة"],"scenario":"توحيد طريقة إعداد تقارير كل فريق الجودة","caution":"يتطلب أحيانًا صلاحيات مدير المؤسسة.","prompt":"Draft an AI use policy for a construction team including confidentiality, QA checks, approval boundaries and change control.","url":"https://claude.com/product/overview"},{"id":"research-career","title":"أبحاث المسار المهني","en":"Career Research","group":"للمهندسين","level":"مبتدئ","description":"استخدم Claude للبحث في متطلبات الوظائف وتحسين استعدادك المهني من دون اختلاق خبرات.","when":"لتطوير CV أو مقابلة عمل أو خطة مهارات.","steps":["قدم خبراتك الفعلية","أرفق الوصف الوظيفي","اطلب مقارنة الفجوات","ضع خطة تعلم قابلة للقياس"],"scenario":"خطة انتقال من Site Engineer إلى Planning Engineer","caution":"لا تدّع خبرات أو شهادات غير موجودة.","prompt":"Compare my real experience with this planning engineer job description. Identify skills gaps and produce a realistic 60-day learning plan.","url":"https://claude.com/product/overview"}],"b":[{"id":1,"title":"مراجعة المواصفات في 15 دقيقة","category":"العقود والمستندات","intro":"حوّل ملف مواصفات طويل إلى متطلبات قابلة للمتابعة.","steps":["ارفع ملف PDF المسموح باستخدامه","حدد أقسامًا أو نطاقًا واضحًا","اطلب Requirement Register مع رقم الصفحة","راجع عينة من كل بند مع المستند"],"tools":"Files","prompt":"Extract a technical requirement register from the attached specification. Include clause reference, requirement, evidence needed, responsible role, and unclear items. Do not invent citations.","deliverable":"متطلبات مرقمة وقائمة بيانات ناقصة"},{"id":2,"title":"من ملاحظات الموقع إلى Daily Report","category":"الموقع والتنفيذ","intro":"حوّل كلمات سريعة إلى تقرير رسمي بدون اختراع أرقام.","steps":["سجّل الوقائع والكميات الحقيقية","حدد تاريخ وفترة الوردية","اطلب مسودة بتقسيم الأعمال والموارد","راجع كميات الإنجاز قبل الإصدار"],"tools":"Chat","prompt":"Rewrite these verified site notes into a professional daily construction report. Preserve all numbers; show missing fields separately.","deliverable":"تقرير موقع وملاحظات تحتاج تأكيد"},{"id":3,"title":"بناء حاسبة خرسانة تفاعلية","category":"التطبيقات","intro":"تعلم تحول طلبًا هندسيًا إلى أداة قابلة للتجربة.","steps":["اكتب المعادلة والوحدات","حدد حدود الإدخال والأخطاء","اطلب Artifact تفاعلي","اختبر 5 حالات بأرقام مستقلة"],"tools":"Artifacts","prompt":"Create an interactive concrete volume calculator in SI units, including validation, audit-friendly formulas and editable assumptions.","deliverable":"حاسبة مع اختبارات قبول"},{"id":4,"title":"مراجعة جدول P6 عمليًا","category":"التخطيط","intro":"نظّم مراجعة البيانات والمنطق والأسباب المحتملة للمشكلات.","steps":["صدّر بيانات البرنامج بصيغة مناسبة","حدد نسخة baseline وupdate","اطلب تحليل منطق العلاقات والقيود","حقق يدويًا في العناصر الحرجة"],"tools":"Files + Data Analysis","prompt":"Audit the attached P6 schedule export for open ends, constraints, abnormal float, logic issues and schedule risks. Cite the rows used.","deliverable":"قائمة مراجعة جدول زمني"},{"id":5,"title":"تحويل Excel إلى تقرير تكلفة","category":"التكاليف","intro":"من جدول تكلفة خام إلى ملخص للإدارة مع معادلات واضحة.","steps":["حدد الأعمدة وعملتها","تحقق من الخانات الناقصة","احسب الانحرافات","اطلب تقريرًا تنفيذيًا مع قيود البيانات"],"tools":"Excel + Data Analysis","prompt":"Analyze this verified project cost spreadsheet. Compute variances with formulas, flag invalid rows and produce a management summary.","deliverable":"Variance Report"},{"id":6,"title":"توحيد تقارير الجودة باستخدام Skill","category":"الجودة","intro":"كرر أفضل أسلوب كتابة تقرير QA/QC لكل مشروع.","steps":["صمم نموذج التقرير","اكتب قواعد البيانات والمراجع","حوّله إلى Skill قابلة لإعادة الاستخدام","اختبره على حالات مختلفة"],"tools":"Skills","prompt":"Draft a reusable quality inspection reporting Skill with required inputs, checklist, NCR routing and approval boundaries.","deliverable":"Skill جاهزة للمراجعة"},{"id":7,"title":"إعداد مطالبة EOT منظمة","category":"العقود والمطالبات","intro":"نظّم وقائع التأخير والأدلة قبل المراجعة التعاقدية.","steps":["اجمع إشعارات ومستندات الحدث","حدد بند العقد والإصدار","أنشئ سجل السبب/الأثر","حدد نقص الإثبات للمراجعة المختصة"],"tools":"Projects + Files","prompt":"Organize the supplied delay event evidence into an EOT claim matrix with notices, dates, causation, critical path impact and missing records.","deliverable":"EOT Evidence Matrix"},{"id":8,"title":"تحليل Clash Register","category":"BIM","intro":"حوّل مئات التعارضات إلى أولويات وإجراءات إغلاق.","steps":["صدّر سجل التعارضات","حدد الأنظمة والمسؤولين","صنف حسب الأثر على التنفيذ","أنشئ قائمة متابعة وقيم مفقودة"],"tools":"Data Analysis","prompt":"Analyze the attached BIM clash register and produce prioritized actions by location, discipline, severity, responsible party and required closeout evidence.","deliverable":"Clash Resolution Tracker"},{"id":9,"title":"بناء نظام Document Control","category":"المكتب الفني","intro":"من ملفات متفرقة إلى سجل موحّد بالإصدارات والحالات.","steps":["عرف الحقول والرموز","صمم قواعد النسخ والاعتمادات","ابنِ أداة أو جدولًا أوليًا","اختبر سجلًا صغيرًا قبل التعميم"],"tools":"Artifacts + Claude Code","prompt":"Design a lightweight engineering document register with version tracking, status validation, owner, due date and printable audit log.","deliverable":"Document Register"},{"id":10,"title":"تحضير مقابلة هندسية محترفة","category":"الوظائف","intro":"تدرب على سؤال وجواب وقيّم مستواك الحقيقي.","steps":["حدد الوظيفة وخبرتك الفعلية","اطلب سؤالًا فنيًا واحدًا كل مرة","جاوب بصياغتك","احصل على Rubric وخطة تحسين"],"tools":"Chat + Projects","prompt":"Act as a technical interviewer for a [role] with [years] experience. Ask one scenario-based question at a time and score my real answer transparently.","deliverable":"Interview Practice Report"},{"id":11,"title":"مقارنة عروض الموردين","category":"المشتريات","intro":"اختيارات فنية وتجارية توضح الافتراضات والفروقات.","steps":["جهز مواصفات الشراء","ارفق العروض بأسماء واضحة","افصل شروط التأهيل الإلزامية","احسب المقارنة وراجع البيانات الناقصة"],"tools":"Files + Excel","prompt":"Compare the supplied vendor offers against mandatory technical specs and commercial criteria. Explain each deviation and missing document.","deliverable":"Tender Comparison Matrix"},{"id":12,"title":"موجز أسبوعي تلقائي","category":"الأتمتة","intro":"خطة إعداد تقرير أسبوعي من ملفات ومصادر معتمدة.","steps":["حدد مصادر العمل","حدد قالبًا ثابتًا","فعّل الجدولة إن كانت متاحة","راجع أول تشغيل قبل الاعتماد"],"tools":"Scheduled Tasks + Connectors","prompt":"Design an approved weekly project reporting workflow with sources, validation, KPIs, review points, and a concise executive output.","deliverable":"Weekly Project Pulse"}],"p":[{"id":1,"category":"Civil & Structural","title":"Structural Design Audit","ar":"راجع افتراضات الإنشاء والأحمال والتعارضات.","text":"Audit the supplied structural design for [PROJECT]. Check load assumptions, load combinations, units, constructability, missing references, and areas requiring a licensed engineering review. Provide a risk-ranked register."},{"id":2,"category":"Civil & Structural","title":"Rebar Takeoff","ar":"حصر تسليح مع توضيح الافتراضات.","text":"Prepare an auditable reinforcement takeoff for [ELEMENTS]. Show bar mark, diameter, length, count, unit weight, total weight, lap assumptions and discrepancy flags."},{"id":3,"category":"Civil & Structural","title":"Foundation Checklist","ar":"قائمة مراجعة للأساسات.","text":"Build a foundation design review checklist for [PROJECT] using the supplied soil report and drawings. Identify unresolved geotechnical, load and detailing inputs."},{"id":4,"category":"Civil & Structural","title":"Concrete Mix Review","ar":"مراجعة بيانات الخرسانة.","text":"Compare the supplied concrete mix submittal against [PROJECT SPECIFICATION]. Create a compliance matrix with required tests, certificates, deviations and open questions."},{"id":5,"category":"Site & Construction","title":"Daily Report","ar":"تحويل ملاحظات الموقع لتقرير.","text":"Create a daily site report from these verified notes: [NOTES]. Include labor, equipment, quantities, completed work, constraints, HSE observations and next shift plan. Preserve all numbers."},{"id":6,"category":"Site & Construction","title":"Method Statement","ar":"بيان طريقة تنفيذ واضح.","text":"Draft a method statement for [ACTIVITY] at [SITE], including prerequisites, sequence, resources, inspection hold points, permit requirements and unresolved risks."},{"id":7,"category":"Site & Construction","title":"Progress Photos","ar":"تحليل أولي للصور المرفوعة.","text":"Describe the visible work in these site photos. Separate observed facts from hypotheses. Ask for drawings and inspection records before making compliance judgments."},{"id":8,"category":"Site & Construction","title":"Site Logistics","ar":"خطة تنظيم موارد الموقع.","text":"Create a preliminary site logistics plan for [PROJECT] including access routes, storage zones, crane constraints, pedestrian separation and permit checks."},{"id":9,"category":"BIM & Digital","title":"Clash Register","ar":"تحديد أولويات تعارضات BIM.","text":"Review this exported clash register: [DATA]. Group duplicates, rank construction impact, and prepare a closeout action list with responsible discipline."},{"id":10,"category":"BIM & Digital","title":"BEP Plan","ar":"خطة تنفيذ BIM.","text":"Outline a BIM Execution Plan for [PROJECT] including roles, model exchanges, naming, CDE, LOIN, QA and handover requirements."},{"id":11,"category":"BIM & Digital","title":"Revit Automation","ar":"وصف سكربت Dynamo.","text":"Design a safe Revit/Dynamo workflow for [TASK] in [VERSION]. Specify category filters, parameters, validations, API limitations and rollback."},{"id":12,"category":"BIM & Digital","title":"Drawing Revision","ar":"مقارنة الإصدارات.","text":"Build a drawing revision change log comparing [REV_A] and [REV_B]. Track scope, quantities, coordination implications and unverified assumptions."},{"id":13,"category":"Planning & Controls","title":"P6 Schedule Check","ar":"فحص منطق الجدول الزمني.","text":"Audit this P6 schedule export for open ends, lags, constraints, date anomalies and critical path sensitivity. Cite affected activities."},{"id":14,"category":"Planning & Controls","title":"EVM Dashboard","ar":"مؤشرات القيمة المكتسبة.","text":"From verified PV, EV, AC and BAC data, calculate SPI, CPI, CV, SV and EAC with transparent formulas and interpretation limits."},{"id":15,"category":"Planning & Controls","title":"Delay Event Log","ar":"سجل أحداث التأخير.","text":"Organize the supplied delay events into a dated register with notice status, evidence, possible schedule impact and unresolved causation."},{"id":16,"category":"Planning & Controls","title":"Recovery Options","ar":"بدائل استدراك المشروع.","text":"Compare three realistic recovery scenarios for [PROJECT]. Show resources, cost, safety risk, prerequisites, constraints and monitoring milestones."},{"id":17,"category":"Quantity & Cost","title":"BOQ Quality Audit","ar":"مراجعة الـBOQ.","text":"Review the attached BOQ for duplicate items, missing units, unpriced lines, unusual quantities and scope omissions. Provide a traceable issue table."},{"id":18,"category":"Quantity & Cost","title":"Cost Estimate","ar":"تقدير سعر بند.","text":"Create a transparent cost estimate for [WORK PACKAGE] using provided labor, material, plant and overhead rates. Mark all unsupported assumptions."},{"id":19,"category":"Quantity & Cost","title":"Cost Forecast","ar":"توقع تكلفة الإتمام.","text":"Forecast estimate at completion for [PROJECT] using actual cost, commitments, progress and change orders. Compare base and risk cases."},{"id":20,"category":"Quantity & Cost","title":"Vendor Offers","ar":"مقارنة عروض الموردين.","text":"Create an auditable technical and commercial comparison matrix for [VENDORS] with mandatory pass/fail criteria and documented exceptions."},{"id":21,"category":"Contracts & Claims","title":"FIDIC Review","ar":"مراجعة بند تعاقدي.","text":"Review the supplied FIDIC-based contract clauses for [ISSUE]. Extract notice conditions, deadlines, exceptions and ambiguities with exact references. Do not give a definitive legal opinion."},{"id":22,"category":"Contracts & Claims","title":"EOT Matrix","ar":"إثبات مطالبة زمنية.","text":"Build an EOT evidence matrix for [EVENT], linking contemporaneous records, notices, schedule updates, causation and gaps requiring expert analysis."},{"id":23,"category":"Contracts & Claims","title":"Variation Proposal","ar":"صياغة أمر تغيير.","text":"Draft a variation proposal for [CHANGE] with scope, provided contractual basis, cost impact, time impact, assumptions and supporting documents."},{"id":24,"category":"Contracts & Claims","title":"Dispute Issue Log","ar":"تجميع نقاط الخلاف.","text":"Organize the dispute correspondence into a factual chronology, contested issues, cited evidence, missing documents and review questions."},{"id":25,"category":"MEP Engineering","title":"Electrical Loads","ar":"مراجعة أحمال كهربائية.","text":"Review [FACILITY] electrical load schedule, distinguishing connected and demand loads. Flag voltage, power factor, diversity and protection design assumptions."},{"id":26,"category":"MEP Engineering","title":"HVAC Compliance","ar":"مقارنة بيانات AHU.","text":"Compare the AHU vendor datasheet with [PROJECT SPECS]. Report each required parameter, offered value, deviation and missing evidence."},{"id":27,"category":"MEP Engineering","title":"Fire Safety Check","ar":"قائمة مراجعة نظم الحريق.","text":"Prepare a preliminary fire protection submittal checklist using provided project requirements. Flag items needing qualified code review."},{"id":28,"category":"MEP Engineering","title":"Commissioning Plan","ar":"خطة اختبار وتشغيل.","text":"Draft a testing and commissioning plan for [SYSTEM] including prerequisites, test steps, measurement records, acceptance references and sign-offs."},{"id":29,"category":"QA/QC & HSE","title":"NCR Draft","ar":"كتابة NCR.","text":"Turn the verified site nonconformity [FACTS] into an NCR draft with requirement, evidence, containment, proposed corrective action and closure criteria."},{"id":30,"category":"QA/QC & HSE","title":"Inspection Test Plan","ar":"إنشاء ITP.","text":"Design an inspection and test plan for [ACTIVITY] including stage, responsibility, witness and hold points, record and specification reference."},{"id":31,"category":"QA/QC & HSE","title":"Safety Risk Register","ar":"سجل مخاطر سلامة.","text":"Draft a preliminary task risk assessment for [ACTIVITY] using the hierarchy of controls, training, permit requirements and emergency arrangements."},{"id":32,"category":"QA/QC & HSE","title":"Root Cause Analysis","ar":"تحليل أسباب NCR.","text":"Facilitate a 5-Why root-cause review for [INCIDENT]. Separate evidence from assumptions and propose testable corrective actions."},{"id":33,"category":"Technical Office","title":"RFI Writer","ar":"إنشاء RFI واضح.","text":"Draft a concise RFI for [ISSUE] citing [DRAWING REVISION], with an exact question, supporting facts, suggested options and unverified impacts."},{"id":34,"category":"Technical Office","title":"Submittal Review","ar":"فحص المواد والمستندات.","text":"Prepare a compliance review for [MATERIAL] with specification requirements, manufacturer evidence, deviations and unresolved approvals."},{"id":35,"category":"Technical Office","title":"Document Register","ar":"سجل مستندات بإصدارات.","text":"Create a document register structure with document number, revision, status, owner, issue date, response date and next action."},{"id":36,"category":"Technical Office","title":"Meeting Minutes","ar":"محضر اجتماع.","text":"Turn these approved meeting notes into concise minutes with decisions, action owners, deadlines, references and unresolved topics."},{"id":37,"category":"Data & Automation","title":"Excel Data Clean","ar":"تدقيق جودة ملفات Excel.","text":"Audit this spreadsheet for missing values, duplicates, inconsistent units, broken formulas and invalid dates. Output a prioritized correction checklist."},{"id":38,"category":"Data & Automation","title":"Python Tool","ar":"وصف أداة Python.","text":"Design a Python 3.11 utility for [TASK]. Include safe file handling, input validation, tests, dry run and logging. Do not execute against production files."},{"id":39,"category":"Data & Automation","title":"Dashboard Metrics","ar":"تصميم مؤشرات المشروع.","text":"Design a project KPI dashboard for [DATA SOURCES]. For every KPI define formula, reporting period, owner, source and limitations."},{"id":40,"category":"Data & Automation","title":"Automation Skill","ar":"مهارة متكررة.","text":"Create a reusable Skill for [RECURRING TASK]. Specify triggers, input schema, validation rules, output template, error handling and review gates."},{"id":41,"category":"Career & Learning","title":"CV Review","ar":"مراجعة سيرة ذاتية.","text":"Review my actual engineering CV for [TARGET ROLE]. Compare with this job description, suggest evidence-based revisions and never fabricate achievements."},{"id":42,"category":"Career & Learning","title":"Interview Practice","ar":"محاكاة مقابلة هندسية.","text":"Act as a senior engineering interviewer for [ROLE] with [YEARS] years of experience. Ask one scenario question at a time and grade fairly."},{"id":43,"category":"Career & Learning","title":"Learning Roadmap","ar":"خطة تعلم 90 يوم.","text":"Build a 90-day engineering learning roadmap for [GOAL] based on current skills, available time and required evidence of competence."},{"id":44,"category":"Career & Learning","title":"Technical Portfolio","ar":"ملف أعمال مهندس.","text":"Create a technical portfolio outline for [DISCIPLINE] using my real project experience, scope, responsibilities, outcomes and anonymized visuals."}],"quiz":[{"q":"لو محتاج أداة تفاعلية صغيرة داخل Claude، تختار؟","a":["Projects","Artifacts","Memory"],"correct":1,"why":"Artifacts مناسبة لإنشاء واجهات وأدوات قابلة للتجربة."},{"q":"المصدر الصحيح لأرقام تقرير المشروع؟","a":["تقدير النموذج","مدخلات موثقة ومراجع","إجابات مستخدمين آخرين"],"correct":1,"why":"لا تستخدم أرقام غير موثقة."},{"q":"لو عندك ملف Excel كبير، أول خطوة؟","a":["تجاهل الوحدات","التحقق من الأعمدة والوحدات","اختيار تصميم جذاب"],"correct":1,"why":"جودة البيانات تسبق التحليل."},{"q":"إزاي تحافظ على تعليمات مشروع متكررة؟","a":["Projects","Voice","Vision"],"correct":0,"why":"Projects للمراجع والتعليمات المرتبطة بمشروع."},{"q":"للحفاظ على أمان API Key؟","a":["وضعه في HTML","نشره في GitHub","حفظه في خادم آمن"],"correct":2,"why":"المفاتيح لا توضع في كود عام."},{"q":"عند مراجعة صورة موقع، تطلب؟","a":["قرار مطابقة نهائي","فصل المرئي عن الافتراض","اختراع أبعاد"],"correct":1,"why":"الصور ليست بديلًا عن القياسات والمعاينة."},{"q":"أي خاصية تساعد على توحيد مهمة متكررة؟","a":["Skills","Image Viewer","Themes"],"correct":0,"why":"Skills تنظّم عمليات متكررة."},{"q":"قبل ربط Connector، تعمل إيه؟","a":["تمنحه كل الصلاحيات","تراجع المصدر والأذونات","تسلمه جميع أسرار الشركة"],"correct":1,"why":"الحد الأدنى من الأذونات ضروري."},{"q":"لإعداد Claim EOT، مهم؟","a":["رابط الحدث بالأدلة والجدول","الاعتماد على التخمين","إهمال الإشعارات"],"correct":0,"why":"الإثبات والتسلسل الزمني من أساسيات المطالبة."},{"q":"هل منصة التعليم دي تستخدم Claude تلقائيًا؟","a":["نعم دون حساب","لا، هي دليل وبرومبتات","تتحكم في حسابي"],"correct":1,"why":"التطبيق التعليمي مستقل ولا ينفذ طلبات Claude بنفسه."}],"asof":"2026-11-07"}</script><script>
"use strict";
const DATA=JSON.parse(document.getElementById("data").textContent),F=DATA.f,B=DATA.b,P=DATA.p,Q=DATA.quiz;
const $=q=>document.querySelector(q),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),LS=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))||def}catch{return def}};
let S={tab:"home",filter:"",cat:"الكل",fav:LS("cmh_fav",[]),done:LS("cmh_done",[]),feature:null,mission:"files",qanswers:{},lab:0,form:{goal:"",project:"",inputs:"",rules:"",format:"Table with sources and action owners"},menu:false};
const tabs=[["home","الرئيسية","⌂"],["features","دليل إمكانيات Claude","▦"],["workflows","مختبر التطبيقات العملية","◈"],["lab","Prompt Studio","✳"],["prompts","البرومبتات الهندسية","⌘"],["quiz","اختبر معلوماتك","✓"],["progress","إنجازاتي والمفضلة","♡"]];
function persist(){try{localStorage.setItem("cmh_fav",JSON.stringify(S.fav));localStorage.setItem("cmh_done",JSON.stringify(S.done))}catch{}}
function go(tab){S.tab=tab;S.filter="";S.cat="الكل";S.menu=false;render();window.scrollTo({top:0,behavior:"instant"})}
function notify(x){const t=$("#toast");t.textContent=x;t.hidden=false;clearTimeout(window.__t);window.__t=setTimeout(()=>t.hidden=true,2300)}
function copy(s){navigator.clipboard.writeText(s).then(()=>notify("تم نسخ البرومبت بنجاح")).catch(()=>notify("تعذر النسخ؛ حدد النص وانسخه يدويًا"))}
function navbar(){return '<aside class="side '+(S.menu?"open":"")+'"><div class="brand"><span class="crown">♛</span><div><strong>CHARTERED<br>ENGINEERS</strong><small>CLAUDE MASTERY HUB</small></div></div><div class="sublabel">من المعرفة إلى التطبيق</div><nav class="navigation">'+tabs.map(t=>'<button data-tab="'+t[0]+'" class="'+(S.tab===t[0]?"active":"")+'"><i>'+t[2]+'</i>'+t[1]+'</button>').join("")+'</nav><div class="sidebottom"><span class="live"></span> مجاني · بدون حساب <p>دليل مستقل غير تابع رسميًا لـAnthropic. يتم حفظ التقدم والمفضلة على جهازك فقط.</p></div></aside>'}
function header(t,d,l){return '<div class="pagehead"><span class="eyebrow">'+l+'</span><h1>'+t+'</h1><p>'+d+'</p></div>'}
function home(){let chosen=F.find(x=>x.id===S.mission)||F[0];let cards=[["features","استكشف إمكانيات Claude","شرح استخدام كل خاصية، المتطلبات، الأخطاء الشائعة، ومثال عملي.","◈"],["workflows","مختبر التطبيقات العملية","12 تجربة هندسية متكاملة تحول المعرفة إلى ناتج واضح.","⌘"],["lab","Prompt Studio","ابنِ برومبت إنجليزي مخصص لمشروعك من مدخلات واضحة.","✳"],["prompts","مكتبة البرومبتات","أوامر إنجليزية متنوعة مشروحة بالعربي للعمل الهندسي.","▤"],["quiz","اختبر معلوماتك","10 أسئلة مع تفسير لكل إجابة، لتثبيت المفاهيم.","✓"],["progress","مسار إنجازك","احفظ المفضلة وتابع الدروس اللي خلصتها في نفس المتصفح.","♡"]];return '<section class="hero"><div class="inner"><span class="eyebrow">CHARTERED ENGINEERS · KNOWLEDGE PLATFORM</span><h1>متتعلمش Claude نظري…<br><em>استخدم قوّته في شغلك.</em></h1><p>دليل عربي عملي لإمكانيات Claude الحالية: شرح واضح، تمارين واقعية، مشروعات هندسية، وبرومبتات إنجليزية بتتخصص على بيانات مشروعك. مجانًا ومن غير تسجيل.</p><div class="actions"><button class="goldbtn" data-tab="features">ابدأ باكتشاف الإمكانيات ←</button><button class="linebtn" data-tab="workflows">جرّب مشروعًا عمليًا ✦</button></div></div></section><div class="metricrow"><div class="metric"><strong>'+F.length+'</strong><small>شرح عملي لخاصية واستخدام</small></div><div class="metric"><strong>'+B.length+'</strong><small>مشروعًا تطبيقيًا خطوة بخطوة</small></div><div class="metric"><strong>'+P.length+'</strong><small>برومبت هندسي أصلي</small></div><div class="metric"><strong>'+S.done.length+'</strong><small>درس أتممته</small></div></div><div class="sectiontitle"><span class="eyebrow">LEARN · BUILD · MASTER</span><h2>مش مجرد شرح… تجربة تعلم متكاملة</h2><p>ابدأ من احتياجك العملي، وكل قسم فيه نتيجة تقدر تستخدمها.</p></div><div class="homecards">'+cards.map(c=>'<button class="homecard" data-tab="'+c[0]+'"><span class="ico">'+c[3]+'</span><b>'+c[1]+'</b><p>'+c[2]+'</p><small>استكشف الآن ←</small></button>').join("")+'</div><div class="featurepick"><div><span class="eyebrow">WHAT SHOULD I USE?</span><h2>مش عارف تستخدم أنهي خاصية؟</h2><p>اختار المهمة، وهتلاقي ترشيح عملي وطلب جاهز للبداية.</p><select id="mission">'+F.filter(x=>["files","artifacts","code","projects","skills","analysis","research","connectors","vision","api","cowork","browser"].includes(x.id)).map(x=>'<option value="'+x.id+'" '+(S.mission===x.id?"selected":"")+'>'+x.title+'</option>').join("")+'</select></div><div class="answer"><b>'+chosen.en+'</b><p>'+chosen.when+'</p><button data-feature="'+chosen.id+'">شوف الشرح والخطوات ←</button></div></div><div class="sourcemeta">آخر مراجعة للمحتوى: '+DATA.asof+' · إتاحة ميزات Claude تتغير حسب الخطة، البلد، الجهاز والسياسات. المعلومات مستندة إلى صفحات الدعم والمنتج الرسمية المربوطة داخل كل شرح. نتائج الذكاء الاصطناعي الهندسية تحتاج مراجعة مهنية مستقلة.</div>'}
function filterbar(values,placeholder){return '<div class="filters"><input id="search" placeholder="'+placeholder+'" value="'+E(S.filter)+'"><select id="cat"><option>الكل</option>'+[...new Set(values)].map(x=>'<option '+(S.cat===x?"selected":"")+'>'+E(x)+'</option>').join("")+'</select></div>'}
function features(){let arr=F.filter(x=>(S.cat==="الكل"||x.group===S.cat)&&[x.title,x.en,x.group,x.description,x.scenario].join(" ").toLowerCase().includes(S.filter.toLowerCase()));return header("دليل إمكانيات Claude","مش بس اسم الخاصية: هتفهم قيمتها، الاستخدام المناسب، خطوات تنفيذ واقعية، مثال جاهز، والتحذيرات المهمة.","FEATURE EXPLORER")+filterbar(F.map(x=>x.group),"ابحث عن ميزة، أو مهمة، أو استخدام…")+'<div class="cards">'+arr.map(x=>'<button class="card" data-feature="'+x.id+'"><small>'+E(x.group)+'</small><h3>'+E(x.title)+'</h3><span class="en">'+E(x.en)+'</span><p>'+E(x.description)+'</p><footer><span>'+E(x.level)+'</span>افتح الدليل ↗</footer></button>').join("")+'</div>'+(arr.length?"":'<div class="empty">لا توجد نتائج، جرّب البحث بكلمة مختلفة.</div>')}
function workflows(){return header("مختبر التطبيقات العملية","12 مشروعًا هندسيًا عمليًا. كل مشروع بيشرح الخطوات والمخرجات والبرومبت، مش مجرد تعريف لخاصية.","ENGINEERING PLAYBOOKS")+'<div class="workflows">'+B.map(x=>'<article class="workflow"><span class="badge">'+E(x.category)+' · '+E(x.tools)+'</span><h3>'+E(x.title)+'</h3><p>'+E(x.intro)+'</p><ol>'+x.steps.map(z=>'<li>'+E(z)+'</li>').join("")+'</ol><div class="deliver">الناتج المتوقع: '+E(x.deliverable)+'</div><button data-copy-play="'+x.id+'">نسخ البرومبت الإنجليزي ↗</button></article>').join("")+'</div>'}
function prompts(onlyFav=false){let arr=P.filter(x=>(S.cat==="الكل"||x.category===S.cat)&&[x.title,x.ar,x.text,x.category].join(" ").toLowerCase().includes(S.filter.toLowerCase())&&(!onlyFav||S.fav.includes(x.id)));return header(onlyFav?"البرومبتات المحفوظة":"المكتبة الهندسية","كل أمر مكتوب بالإنجليزي، وبيشرح بالعربي استخدامه. استبدل البيانات بين الأقواس بمعلوماتك، وراجع النتائج قبل الاعتماد.","PROFESSIONAL PROMPT LIBRARY")+filterbar(P.map(x=>x.category),"ابحث عن تخصص أو مهمة هندسية…")+'<div class="promptgrid">'+arr.map(x=>'<article class="promptcard"><span class="cat">'+E(x.category)+'</span><h3>'+E(x.title)+'</h3><p class="desc">'+E(x.ar)+'</p><pre>'+E(x.text)+'</pre><div class="tools"><button data-copy-prompt="'+x.id+'">نسخ البرومبت</button><button title="حفظ في المفضلة" class="heart '+(S.fav.includes(x.id)?"on":"")+'" data-fav="'+x.id+'">'+(S.fav.includes(x.id)?"♥":"♡")+'</button></div></article>').join("")+'</div>'+(arr.length?"":'<div class="empty">لا توجد أوامر في هذا القسم.</div>')}
function labPrompt(){let t=P[S.lab]||P[0],x=S.form;return "You are an experienced engineering professional.\n\nTASK TEMPLATE:\n"+t.text+"\n\nPROJECT CONTEXT:\nProject: "+(x.project||"[PROJECT NAME]")+"\nGoal: "+(x.goal||"[SPECIFIC OBJECTIVE]")+"\nAvailable facts and input sources:\n"+(x.inputs||"[PASTE VERIFIED INPUT DATA OR DESCRIBE ATTACHMENTS]")+"\nApplicable standard / constraints:\n"+(x.rules||"[PROJECT SPECIFICATIONS AND CODE EDITION, IF KNOWN]")+"\nRequired output format: "+(x.format||"Structured table")+"\n\nQUALITY RULES:\n1. Use only provided facts; do not invent numerical values, citations or compliance claims.\n2. Clearly separate facts, assumptions and missing information.\n3. Cite source sections wherever source documents are provided.\n4. Ask clarifying questions where essential.\n5. State that final engineering approval requires a qualified professional."}
function lab(){return header("Prompt Studio","اكتب هدفك ومعلومات مشروعك، وهتطلع ببرومبت إنجليزي مخصص، مع ضوابط تمنع اختراع الحقائق والمراجع.","BUILD A BETTER PROMPT")+'<div class="lab"><section class="panel"><h2>① اضبط البرومبت</h2><div class="field"><label>القالب الهندسي</label><select id="labtemplate">'+P.map((x,i)=>'<option value="'+i+'" '+(i===S.lab?"selected":"")+'>'+E(x.category+" — "+x.title)+'</option>').join("")+'</select></div>'+[["goal","الهدف المحدد","مثال: إعداد تقرير تكلفة للمقاول"],["project","اسم / وصف المشروع","مثال: مشروع إسكان بالرياض"],["inputs","البيانات والمستندات المتاحة","صف الملفات والبيانات الموثقة"],["rules","الأكواد والقيود","مثال: طبقًا للمواصفات المعتمدة وإصدار الكود…"],["format","شكل المخرجات","مثال: جدول بالبنود والمرجع والمسؤول"]].map(z=>'<div class="field"><label>'+z[1]+'</label>'+(z[0]==="inputs"||z[0]==="rules"?'<textarea data-field="'+z[0]+'" placeholder="'+z[2]+'">'+E(S.form[z[0]])+'</textarea>':'<input data-field="'+z[0]+'" value="'+E(S.form[z[0]])+'" placeholder="'+z[2]+'">')+'</div>').join("")+'</section><section class="panel"><h2>② البرومبت الجاهز بالإنجليزي</h2><p style="font-size:12px;color:#758a99;line-height:1.9">النتيجة تتحدث تلقائيًا مع كل تعديل. انسخ الأمر وافتح Claude أو ChatGPT لإرساله.</p><pre class="outputbox" id="laboutput">'+E(labPrompt())+'</pre><button class="labcopy" id="labcopy">نسخ البرومبت الكامل</button><div class="hint" style="margin-top:18px">تنبيه: ده منشئ برومبتات، مش اتصال مباشر بنموذج Claude، ومش بيقرأ الملفات نيابة عنك. ألصق البيانات أو ارفع المرفقات داخل خدمة الذكاء الاصطناعي اللي هتستخدمها.</div></section></div>'}
function quiz(){let score=Q.filter((x,i)=>S.qanswers[i]===x.correct).length;return header("اختبر نفسك","10 أسئلة بتغطي الاستخدامات والتطبيقات والأمان. كل اختيار بيظهر تفسير مبسط فورًا.","KNOWLEDGE CHECK")+'<div class="metricrow" style="grid-template-columns:repeat(2,1fr)"><div class="metric"><strong>'+Object.keys(S.qanswers).length+' / 10</strong><small>أسئلة تمت الإجابة عنها</small></div><div class="metric"><strong>'+score+' / 10</strong><small>إجابات صحيحة</small></div></div>'+Q.map((q,i)=>'<section class="quizitem"><span class="eyebrow">QUESTION '+(i+1)+'</span><h3>'+E(q.q)+'</h3><div class="choices">'+q.a.map((a,j)=>'<button class="'+(S.qanswers[i]===j?(j===q.correct?"correct":"wrong"):"")+'" data-answer="'+i+'-'+j+'">'+E(a)+'</button>').join("")+'</div>'+(S.qanswers[i]!==undefined?'<div class="explain">'+(S.qanswers[i]===q.correct?"✓ إجابة صحيحة. ":"الإجابة الصحيحة: "+E(q.a[q.correct])+". ")+E(q.why)+'</div>':"")+'</section>').join("")+'<div class="actions"><button class="goldbtn" id="resetquiz">إعادة الاختبار ↺</button></div>'}
function progress(){return header("تقدمك والمفضلة","جميع البيانات تُحفظ محليًا في المتصفح فقط، بدون إنشاء حساب أو رفعها إلى أي خادم.","YOUR LEARNING JOURNEY")+'<section class="panel"><h2>إنجاز الأدلة</h2><p>أكملت '+S.done.length+' من '+F.length+' درسًا.</p><div class="progress"><i style="width:'+(100*S.done.length/F.length)+'%"></i></div><button class="labcopy" data-tab="features">تابع التعلم ←</button></section><div class="sectiontitle"><h2>الأوامر اللي حفظتها</h2></div>'+prompts(true)}
function modal(){let x=F.find(x=>x.id===S.feature);if(!x)return "";return '<div class="overlay" data-overlay="1"><section class="modal" role="dialog" aria-modal="true" aria-label="'+E(x.title)+'"><button class="close" id="close">✕</button><span class="eyebrow">'+E(x.group)+' · '+E(x.level)+'</span><h2>'+E(x.title)+'</h2><div class="en">'+E(x.en)+'</div><p>'+E(x.description)+'</p><h3>إمتى تستخدمها؟</h3><p>'+E(x.when)+'</p><div class="steps"><h3>الخطوات العملية</h3><ol>'+x.steps.map(x=>'<li>'+E(x)+'</li>').join("")+'</ol></div><h3>مثال من الواقع الهندسي</h3><p>'+E(x.scenario)+'</p><h3>جرّب البرومبت ده</h3><pre>'+E(x.prompt)+'</pre><button class="copy" id="copy-feature">نسخ الأمر الإنجليزي</button><h3>خلي بالك</h3><div class="warn">'+E(x.caution)+'</div><div class="end"><button class="done" id="done">'+(S.done.includes(x.id)?"✓ إلغاء إتمام الدرس":"✓ اكتملت مراجعة الدرس")+'</button><a target="_blank" rel="noopener noreferrer" href="'+E(x.url)+'">معلومات من المصدر الرسمي ↗</a></div></section></div>'}
function render(){let content=S.tab==="home"?home():S.tab==="features"?features():S.tab==="workflows"?workflows():S.tab==="prompts"?prompts():S.tab==="lab"?lab():S.tab==="quiz"?quiz():progress();$("#app").innerHTML='<div class="shell">'+navbar()+'<div class="frame"><header class="topbar"><button class="mobile" id="menu">☰</button><small>Chartered Engineers / Claude Mastery Hub</small><strong>FREE LEARNING PLATFORM</strong></header><main class="main">'+content+'</main><footer class="footer">© Chartered Engineers · محتوى تعليمي مستقل · '+DATA.asof+' · قد تختلف المزايا حسب خطة Claude والمنطقة والجهاز. المرجع النهائي هو الوثائق الرسمية.</footer></div></div>'+modal()+'<div class="toast" id="toast" hidden></div>'}
document.addEventListener("click",e=>{let t=e.target.closest("button");if(e.target.matches("[data-overlay]")){S.feature=null;render();return}if(!t)return;if(t.dataset.tab){go(t.dataset.tab);return}if(t.dataset.feature){S.feature=t.dataset.feature;render();return}if(t.id==="menu"){S.menu=!S.menu;render();return}if(t.id==="close"){S.feature=null;render();return}if(t.id==="copy-feature"){copy(F.find(x=>x.id===S.feature).prompt);return}if(t.id==="done"){let id=S.feature;S.done=S.done.includes(id)?S.done.filter(x=>x!==id):S.done.concat(id);persist();render();return}if(t.dataset.fav){let id=Number(t.dataset.fav);S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):S.fav.concat(id);persist();render();return}if(t.dataset.copyPrompt){copy(P.find(x=>x.id===Number(t.dataset.copyPrompt)).text);return}if(t.dataset.copyPlay){copy(B.find(x=>x.id===Number(t.dataset.copyPlay)).prompt);return}if(t.dataset.answer){let [i,j]=t.dataset.answer.split("-").map(Number);S.qanswers[i]=j;render();return}if(t.id==="resetquiz"){S.qanswers={};render();return}if(t.id==="labcopy"){copy(labPrompt());return}});
document.addEventListener("input",e=>{let t=e.target;if(t.id==="search"){S.filter=t.value;let start=t.selectionStart;render();let z=$("#search");if(z){z.focus();z.setSelectionRange(start,start)}return}if(t.dataset.field){S.form[t.dataset.field]=t.value;let o=$("#laboutput");if(o)o.textContent=labPrompt()}});
document.addEventListener("change",e=>{let t=e.target;if(t.id==="cat"){S.cat=t.value;render()}if(t.id==="mission"){S.mission=t.value;render()}if(t.id==="labtemplate"){S.lab=Number(t.value);render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.feature){S.feature=null;render()}});
render();
</script></body></html>
